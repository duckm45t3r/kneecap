[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Security-sensitive deps pinned to exact patch ranges so a future
# `cargo update` can't pull in a compromised or yanked patch silently.
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
keyring = { version = "=3.6.3", features = ["apple-native"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "=1.41.1", features = ["full"] }
futures-util = { version = "=0.3.31", default-features = false }

