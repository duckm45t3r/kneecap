[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Security-sensitive deps pinned to exact patch ranges so a future
# `cargo update` can't pull in a compromised or yanked patch silently.
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-opener = "=2.5.4"
# W5 distribution: GitHub Releases auto-update. Requires a minisign pubkey in
# tauri.conf.json plugins.updater.pubkey — Wei generates the real keypair with
# `tauri signer generate` (see BUILD.md). A clearly-marked PLACEHOLDER pubkey is
# set in tauri.conf.json so the project compiles + cargo check passes; the
# updater will reject real update manifests until the placeholder is replaced.
tauri-plugin-updater = "=2.10.1"
# Report export (PDF / DOCX): native "Save As" dialog so a VC picks the
# location/filename. We use ONLY the dialog plugin's save picker — the actual
# byte write goes through our own hand-rolled `save_export_file` command +
# std::fs, deliberately staying off tauri-plugin-fs's ACL (same posture as the
# saved-report commands). DOCX bytes are built client-side by the `docx` JS lib;
# PDF uses the webview's print-to-PDF (no extra crate).
tauri-plugin-dialog = "=2.7.1"
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.140"
keyring = { version = "=3.6.3", features = ["apple-native"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "=1.41.1", features = ["full"] }
futures-util = { version = "=0.3.31", default-features = false }
# Zero plaintext API keys from heap after use (audit I3). zeroize crate is
# zero-dep and stable; the Zeroizing<String> wrapper drops bytes on Drop
# instead of leaving them in heap for the next allocator.
zeroize = { version = "=1.8.1", features = ["derive"] }
# PDF text extraction for Quick Memo PDF upload (W3 R1). Pure Rust, no
# external deps; handles text-based PDFs. Scanned / image-only PDFs need
# OCR — out of scope for now (we error gracefully on empty extract).
pdf-extract = "=0.7.7"
base64 = "=0.22.1"
# Deals + version history (W4/W5). Bundled SQLite — no system libsqlite3
# dependency, so the build is self-contained on every dev/CI machine. The DB
# lives at {app_data_dir}/kneecap.db; see the "Deals + version history" section
# in lib.rs. Pinned to an exact patch like the other security-sensitive deps.
rusqlite = { version = "=0.31.0", features = ["bundled"] }

